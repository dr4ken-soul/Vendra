# Favicon.
#
# Vendra uses a TEXT wordmark only. There is no logo, monogram or brand symbol,
# so the favicon is a bare character rather than generated artwork.
#
# Rendered as an SVG so it stays crisp and weighs a few hundred bytes.
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#F4F6F4" />
  <text
    x="32"
    y="45"
    text-anchor="middle"
    font-family="Barlow, Helvetica, Arial, sans-serif"
    font-size="42"
    font-weight="600"
    letter-spacing="-2"
    fill="#242A27"
  >V</text>
  <rect x="16" y="52" width="32" height="2" rx="1" fill="#B9402E" />
</svg>